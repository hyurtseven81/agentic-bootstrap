name: gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run repo gates
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || '' }}
        run: gates/run-all.sh
